# Test and review the python code.
---
name: Test and review the python code.
on: workflow_dispatch
jobs:
    Build-Job:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the code 
              uses: actions/checkout@v7
              with:
                repository: allius01/Jenkins-Python-Pipeline-demo
                ref: master

            - name: Setup python
              uses: actions/setup-python@v7
              with:
                python-version: '3.13'

            - name: Install dependencies
              run: |
                pip install --upgrade pip
                pip install -r requirement.txt
            
            - name: Set path for tests cases
              run : echo "PYTHONPATH=$GITHUB WORKSPACE" >> $GITHUB ENV
              
            - name: Test the code 
              run: |
                pytest tests --cov=app --cov-report=xml